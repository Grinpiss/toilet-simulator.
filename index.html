<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toilet Simulator</title>
<link rel="stylesheet" href="style.css">
<script src="three.min.js"></script>
</head>
<body>
<script src="https://cloudflare.com"></script>
<div id="start" onclick="startGame()">
 <div class="panel">
  <h1>🚽 TOILET SIMULATOR</h1>
  <p>Добро пожаловать в туалет.</p>
  <p><small>WASD — движение<br>Мышь — обзор<br>E — взаимодействие<br>F — облегчиться</small></p>
  <button type="button" onclick="startGame()">ИГРАТЬ (или нажми Пробел)</button>
 </div>
</div>

<div id="hud">
 <div id="title">TOILET SIMULATOR</div>
 <div id="cross"></div>
 <div id="prompt"></div>
 <div id="help">WASD — движение | E — действие | F — облегчиться<br>Найди предмет и посмотри на него</div>
</div>

<script src="game.js"></script>
</body>
</html>
