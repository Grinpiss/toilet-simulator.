<script type="module">
import * as THREE from 'three';

// --- ЗВУКОВОЙ ДВИЖОК (WEB AUDIO API) ---
let audioCtx = null;
let tapNoiseNode = null;

function initAudio() {
 if (!audioCtx) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 }
 if (audioCtx.state === 'suspended') {
  audioCtx.resume();
 }
}

// Генератор белого шума для воды и шипения
function createNoiseBuffer() {
 const bufferSize = audioCtx.sampleRate * 2;
 const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
 const data = buffer.getChannelData(0);
 for (let i = 0; i < bufferSize; i++) {
  data[i] = Math.random() * 2 - 1;
 }
 return buffer;
}

const sfx = {
 // Смыв унитаза
 flush() {
  initAudio();
  const now = audioCtx.currentTime;
  const noise = audioCtx.createBufferSource();
  noise.buffer = createNoiseBuffer();
  noise.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(600, now);
  filter.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
  filter.frequency.exponentialRampToValueAtTime(300, now + 2.5);
  filter.Q.value = 1.5;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.01, now);
  gain.gain.linearRampToValueAtTime(0.4, now + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.6);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start(now);
  noise.stop(now + 2.6);
 },

 // Включение / выключение крана
 toggleTap(isOn) {
  initAudio();
  if (isOn) {
   if (tapNoiseNode) return;
   const noise = audioCtx.createBufferSource();
   noise.buffer = createNoiseBuffer();
   noise.loop = true;

   const filter = audioCtx.createBiquadFilter();
   filter.type = 'highpass';
   filter.frequency.value = 1000;

   const gain = audioCtx.createGain();
   gain.gain.value = 0.15;

   noise.connect(filter);
   filter.connect(gain);
   gain.connect(audioCtx.destination);
   noise.start();
   tapNoiseNode = noise;
  } else if (tapNoiseNode) {
   tapNoiseNode.stop();
   tapNoiseNode = null;
  }
 },

 // Глоток (для кофе и пива)
 gulp(delay = 0) {
  initAudio();
  const now = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, now);
  osc.frequency.exponentialRampToValueAtTime(380, now + 0.12);
  osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);

  gain.gain.setValueAtTime(0.01, now);
  gain.gain.linearRampToValueAtTime(0.35, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.27);
 },

 // Кофе: сёрб + глоток
 coffee() {
  initAudio();
  const now = audioCtx.currentTime;
  const noise = audioCtx.createBufferSource();
  noise.buffer = createNoiseBuffer();

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(800, now);
  filter.frequency.linearRampToValueAtTime(2200, now + 0.25);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 0.25);

  this.gulp(0.28);
 },

 // Пиво: пшик пробки + два глотка
 beer() {
  initAudio();
  const now = audioCtx.currentTime;
  const noise = audioCtx.createBufferSource();
  noise.buffer = createNoiseBuffer();

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 3000;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 0.2);

  this.gulp(0.3);
  this.gulp(0.65);
 },

 // Звук облегчения (пердёж)
 fart() {
  initAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(95, now);
  osc.frequency.linearRampToValueAtTime(65, now + 0.25);
  osc.frequency.linearRampToValueAtTime(45, now + 0.55);

  // Добавляем вибрацию (модуляцию)
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 28;
  lfoGain.gain.value = 25;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  lfo.start(now);
  osc.start(now);
  lfo.stop(now + 0.6);
  osc.stop(now + 0.6);
 },

 // Щелчок выключателя или спрея
 click() {
  initAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(900, now);
  osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.05);
 }
};

// --- СЦЕНА И ОБЪЕКТЫ ---

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ca7aa);
scene.fog = new THREE.Fog(0x9ca7aa, 10, 24);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.65, 2.5);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x60616b, 2));
const mainLight = new THREE.PointLight(0xffedcf, 65, 18);
mainLight.position.set(0, 4.5, 0);
mainLight.castShadow = true;
scene.add(mainLight);

const materials = {
 tile: new THREE.MeshStandardMaterial({ color: 0xc5c9c8, roughness: 0.3 }),
 wall: new THREE.MeshStandardMaterial({ color: 0xadb8b8, roughness: 0.8 }),
 white: new THREE.MeshStandardMaterial({ color: 0xf0eee8, roughness: 0.2 }),
 metal: new THREE.MeshStandardMaterial({ color: 0x999fa3, metalness: 0.85, roughness: 0.2 }),
 dark: new THREE.MeshStandardMaterial({ color: 0x343b40, roughness: 0.5 }),
 water: new THREE.MeshStandardMaterial({ color: 0x53c8ee, transparent: true, opacity: 0.5, roughness: 0.1 })
};

function box(name, x, y, z, sx, sy, sz, mat, shadow = true) {
 const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
 m.name = name; m.position.set(x, y, z);
 m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m;
}
function cylinder(x, y, z, rt, rb, h, mat) {
 const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), mat);
 m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

// ROOM
box("floor", 0, -0.15, 0, 8, 0.3, 8, materials.tile);
box("back wall", 0, 2, -4, 8, 4, 0.2, materials.wall);
box("left wall", -4, 2, 0, 0.2, 4, 8, materials.wall);
box("right wall", 4, 2, 0, 0.2, 4, 8, materials.wall);
box("ceiling", 0, 4.1, 0, 8, 0.2, 8, materials.white);

const gridMat = new THREE.LineBasicMaterial({ color: 0x8e9999, transparent: true, opacity: 0.35 });
for (let i = -3.5; i <= 3.5; i += 0.5) {
 const points = [new THREE.Vector3(i, 0.008, -3.9), new THREE.Vector3(i, 0.008, 3.9)];
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), gridMat));
 const points2 = [new THREE.Vector3(-3.9, 0.008, i), new THREE.Vector3(3.9, 0.008, i)];
