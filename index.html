<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toilet Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:20px;left:24px;font-size:20px;font-weight:bold;letter-spacing:3px}
#help{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;background:#111b;padding:14px 24px;border:1px solid #ffffff33;border-radius:12px;line-height:1.8}
#prompt{position:absolute;top:57%;left:50%;transform:translate(-50%,-50%);font-size:17px;background:#111d;padding:12px 20px;border-radius:9px;display:none}
#cross{position:absolute;top:50%;left:50%;width:5px;height:5px;background:white;border-radius:50%;transform:translate(-50%,-50%)}
#start{position:fixed;inset:0;background:linear-gradient(#101820dd,#101820f2);display:flex;align-items:center;justify-content:center;z-index:5;text-align:center}
.panel{background:#202a32;padding:35px;border-radius:18px;width:min(90%,420px);box-shadow:0 20px 70px #0009}
h1{letter-spacing:4px;font-size:30px}
button{background:#e6e6e6;color:#151515;border:0;border-radius:8px;padding:14px 28px;font-weight:bold;cursor:pointer;font-size:16px}
small{color:#aaa;line-height:1.7}
</style>
</head>
<body>
<div id="start">
 <div class="panel">
  <h1>🚽 TOILET SIMULATOR</h1>
  <p>Добро пожаловать в туалет.</p>
  <p><small>WASD — движение<br>Мышь — обзор<br>E — взаимодействие<br>ESC — освободить мышь</small></p>
  <button id="play">ИГРАТЬ</button>
 </div>
</div>
<div id="hud">
 <div id="title">TOILET SIMULATOR</div>
 <div id="cross"></div>
 <div id="prompt"></div>
 <div id="help">WASD — движение &nbsp; | &nbsp; E — действие<br>Найди предмет и посмотри на него</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ca7aa);
scene.fog = new THREE.Fog(0x9ca7aa, 10, 24);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.65, 2.5);
camera.rotation.order = 'YXZ'; // Важно для корректного поворота головой

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x60616b, 2));
const mainLight = new THREE.PointLight(0xffedcf, 65, 18);
mainLight.position.set(0, 4.5, 0);
mainLight.castShadow = true;
scene.add(mainLight);

const materials = {
 tile: new THREE.MeshStandardMaterial({ color: 0xc5c9c8, roughness: 0.3 }),
 wall: new THREE.MeshStandardMaterial({ color: 0xadb8b8, roughness: 0.8 }),
 white: new THREE.MeshStandardMaterial({ color: 0xf0eee8, roughness: 0.2 }),
 metal: new THREE.MeshStandardMaterial({ color: 0x999fa3, metalness: 0.85, roughness: 0.2 }),
 dark: new THREE.MeshStandardMaterial({ color: 0x343b40, roughness: 0.5 }),
 water: new THREE.MeshStandardMaterial({ color: 0x53c8ee, transparent: true, opacity: 0.5, roughness: 0.1 })
};

function box(name, x, y, z, sx, sy, sz, mat, shadow = true) {
 const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
 m.name = name; m.position.set(x, y, z);
 m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m;
}
function cylinder(x, y, z, rt, rb, h, mat) {
 const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), mat);
 m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

// ROOM
box("floor", 0, -0.15, 0, 8, 0.3, 8, materials.tile);
box("back wall", 0, 2, -4, 8, 4, 0.2, materials.wall);
box("left wall", -4, 2, 0, 0.2, 4, 8, materials.wall);
box("right wall", 4, 2, 0, 0.2, 4, 8, materials.wall);
box("ceiling", 0, 4.1, 0, 8, 0.2, 8, materials.white);

// Decorative tile lines
const gridMat = new THREE.LineBasicMaterial({ color: 0x8e9999, transparent: true, opacity: 0.35 });
for (let i = -3.5; i <= 3.5; i += 0.5) {
 const points = [new THREE.Vector3(i, 0.008, -3.9), new THREE.Vector3(i, 0.008, 3.9)];
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), gridMat));
 const points2 = [new THREE.Vector3(-3.9, 0.008, i), new THREE.Vector3(3.9, 0.008, i)];
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points2), gridMat));
}

// TOILET
const toilet = new THREE.Group();
toilet.position.set(1.5, 0, -1.7);
scene.add(toilet);
function tbox(x, y, z, sx, sy, sz, mat) {
 const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
 m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; toilet.add(m); return m;
}
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.3, 0.65, 32), materials.white);
base.position.y = 0.34; base.scale.z = 1.3; base.castShadow = true; toilet.add(base);
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.36, 0.2, 40), materials.white);
bowl.position.set(0, 0.68, -0.08); bowl.scale.z = 1.15; toilet.add(bowl);
const seat = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.055, 12, 48), materials.dark);
seat.rotation.x = Math.PI / 2; seat.position.set(0, 0.81, -0.08); seat.scale.set(1, 1.18, 1); toilet.add(seat);
const tank = tbox(0, 1.05, 0.38, 0.75, 0.85, 0.3, materials.white);
const flushButton = tbox(0.27, 1.5, 0.21, 0.12, 0.06, 0.05, materials.metal);
flushButton.userData = { action: "flush", label: "Нажми E — смыть воду" };

// SINK
box("sink stand", -2, 0.45, -1.65, 0.9, 0.9, 0.65, materials.white);
const basin = cylinder(-2, 0.96, -1.65, 0.58, 0.58, 0.16, materials.white);
basin.scale.z = 0.72;
const tap = cylinder(-2, 1.25, -1.88, 0.045, 0.045, 0.35, materials.metal);
tap.userData = { action: "water", label: "Нажми E — включить кран" };
const faucet = box("faucet", -2, 1.4, -1.72, 0.35, 0.06, 0.06, materials.metal);
const sinkWater = cylinder(-2, 1.15, -1.6, 0.02, 0.02, 0.4, materials.water);
sinkWater.visible = false;

// MIRROR
const mirror = box("mirror", -2, 2.25, -3.88, 1.3, 1.3, 0.06,
 new THREE.MeshStandardMaterial({ color: 0x9ac6d0, metalness: 0.9, roughness: 0.08 }));

// DOOR
const doorPivot = new THREE.Group();
doorPivot.position.set(-1.5, 0, 3.88);
scene.add(doorPivot);
const door = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 0.12),
 new THREE.MeshStandardMaterial({ color: 0x795c45, roughness: 0.65 }));
door.position.set(0.75, 1.5, 0); door.castShadow = true; doorPivot.add(door);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), materials.metal);
knob.position.set(1.3, 1.5, -0.1); doorPivot.add(knob);
door.userData = { action: "door", label: "Нажми E — открыть дверь" };

// LIGHT SWITCH
const switchPlate = box("switch", -3.88, 1.5, 0.8, 0.06, 0.35, 0.22, materials.white);
switchPlate.userData = { action: "light", label: "Нажми E — выключить свет" };

// WATER EFFECT
const water = cylinder(1.5, 0.79, -1.78, 0.38, 0.38, 0.015, materials.water);
water.visible = false;

// COFFEE
const coffee = cylinder(-2, 1.15, -1.05, 0.13, 0.13, 0.3, materials.white);
coffee.userData = { action: "coffee", label: "Нажми E — выпить кофе" };

const coffeeLiquid = cylinder(-2, 1.305, -1.05, 0.105, 0.105, 0.012,
 new THREE.MeshStandardMaterial({ color: 0x4b2410 }));
coffeeLiquid.userData = { action: "coffee", label: "Нажми E — выпить кофе" };

// AIR FRESHENER
const spray = cylinder(-2.8, 1.05, -1.5, 0.09, 0.09, 0.38, materials.white);
spray.userData = { action: "spray", label: "Нажми E — освежитель воздуха" };
const nozzle = box("spray nozzle", -2.8, 1.25, -1.5, 0.12, 0.06, 0.12, materials.metal);

// TOILET PAPER
const paper = cylinder(3.75, 1.15, -1.7, 0.16, 0.16, 0.24, materials.white);
paper.rotation.z = Math.PI / 2;
paper.userData = { action: "paper", label: "Нажми E — оторвать бумагу" };
const strip = box("paper strip", 3.75, 0.85, -1.7, 0.12, 0.35, 0.025, materials.white);
strip.visible = false;

// BEER BOTTLE — СТАРАЯ КРЕПОСТЬ
const beerBottle = new THREE.Group();
beerBottle.position.set(2.95, 1.1, -1.7);
scene.add(beerBottle);

const glass = new THREE.MeshStandardMaterial({ color: 0x63351b, roughness: 0.2, metalness: 0.15 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.32, 24), glass);
body.userData = { action: "beer", label: "Нажми E — взять пиво СК" };
beerBottle.add(body);

// ИСПРАВЛЕНИЕ 1: Объявляем список ПОСЛЕ создания всех объектов
const interactables = [
 flushButton, tap, door, switchPlate,
 coffee, coffeeLiquid, spray, paper, body
];

// --- НЕДОСТАЮЩАЯ ЛОГИКА ИГРЫ ---

const startScreen = document.getElementById('start');
const playBtn = document.getElementById('play');
const promptEl = document.getElementById('prompt');

// Захват мыши при нажатии "ИГРАТЬ"
playBtn.addEventListener('click', () => {
 document.body.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
 startScreen.style.display = document.pointerLockElement ? 'none' : 'flex';
});

// Вращение камеры мышью
document.addEventListener('mousemove', (e) => {
 if (document.pointerLockElement) {
  camera.rotation.y -= e.movementX * 0.002;
  camera.rotation.x -= e.movementY * 0.002;
  camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
 }
});

// Отслеживание клавиш WASD
const keys = {};
document.addEventListener('keydown', (e) => {
 keys[e.code] = true;
 if (e.code === 'KeyE' && currentTarget) {
  handleInteraction(currentTarget.userData.action);
 }
});
document.addEventListener('keyup', (e) => keys[e.code] = false);

// Обработка действий при нажатии E
let doorOpen = false;
let lightOn = true;
